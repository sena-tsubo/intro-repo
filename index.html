<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>Landing Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Website</h1>

      </ul>
    </nav>

  <main class="hero">
    <section class="hero-image">

        私たちはブランドの成長を支えるデザインと戦略を提供しています。<br>
        見た目だけでなく、伝わるメッセージと体験まで一貫して考えます。

      <div class="actions">
        <a href="#" class="primary">無料相談</a>
